<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BugHunter AI — Autonomous Bug Bounty Framework</title>
<style>
  :root {
    --bg: #0b1120;
    --bg-card: #111827;
    --bg-input: #1f2937;
    --border: #1e3a5f;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --critical: #ef4444;
    --high: #f97316;
    --medium: #eab308;
    --low: #22c55e;
    --info: #64748b;
    --zeroday: #a855f7;
    --success: #22c55e;
    --running: #3b82f6;
    --pending: #64748b;
    --failed: #ef4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  a { color: var(--accent); text-decoration: none; }

  /* Header */
  header {
    background: var(--bg-card); border-bottom: 2px solid var(--accent);
    padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  header .logo { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 700; }
  header .logo .icon { font-size: 28px; }
  header .logo span { color: var(--accent); }
  header .stats { display: flex; gap: 16px; font-size: 13px; color: var(--text-muted); }
  header .stats .stat { background: var(--bg-input); padding: 6px 14px; border-radius: 20px; }
  header .stats .stat b { color: var(--text); }

  /* Layout */
  .layout { display: flex; min-height: calc(100vh - 69px); }
  nav {
    width: 220px; background: var(--bg-card); border-right: 1px solid var(--border);
    padding: 16px 0; flex-shrink: 0;
  }
  nav a {
    display: flex; align-items: center; gap: 10px; padding: 10px 24px;
    color: var(--text-muted); font-size: 14px; cursor: pointer; border-left: 3px solid transparent;
    transition: all 0.15s;
  }
  nav a:hover, nav a.active { color: var(--text); background: rgba(59,130,246,0.1); border-left-color: var(--accent); }
  nav a .nav-icon { font-size: 16px; width: 20px; text-align: center; }
  nav .nav-section { padding: 16px 24px 6px; font-size: 11px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; }

  main { flex: 1; padding: 24px; overflow-y: auto; max-height: calc(100vh - 69px); }

  /* Cards */
  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  .card-header { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .grid { display: grid; gap: 16px; }
  .grid-2 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 900px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } nav { display: none; } }

  /* Stat cards */
  .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; text-align: center; }
  .stat-card .value { font-size: 32px; font-weight: 700; }
  .stat-card .label { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .stat-card.critical .value { color: var(--critical); }
  .stat-card.high .value { color: var(--high); }
  .stat-card.total .value { color: var(--accent); }
  .stat-card.active .value { color: var(--success); }

  /* Buttons */
  button, .btn {
    background: var(--accent); color: white; border: none; padding: 8px 18px; border-radius: 6px;
    font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.15s;
  }
  button:hover, .btn:hover { background: var(--accent-hover); }
  button:disabled, .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-sm { padding: 5px 12px; font-size: 12px; }
  .btn-danger { background: var(--critical); }
  .btn-danger:hover { background: #dc2626; }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-outline:hover { background: var(--bg-input); }

  /* Forms */
  .form-group { margin-bottom: 14px; }
  label { display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 4px; }
  input, select, textarea {
    width: 100%; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 14px; color: var(--text); font-size: 14px; font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }

  /* Tables */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 10px 14px; color: var(--text-muted); font-weight: 600; border-bottom: 1px solid var(--border); font-size: 12px; text-transform: uppercase; }
  td { padding: 10px 14px; border-bottom: 1px solid rgba(30,58,95,0.3); }
  tr:hover td { background: rgba(59,130,246,0.05); }

  /* Badges */
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .badge-critical { background: rgba(239,68,68,0.2); color: var(--critical); }
  .badge-high { background: rgba(249,115,22,0.2); color: var(--high); }
  .badge-medium { background: rgba(234,179,8,0.2); color: var(--medium); }
  .badge-low { background: rgba(34,197,94,0.2); color: var(--low); }
  .badge-info { background: rgba(100,116,139,0.2); color: var(--info); }
  .badge-running { background: rgba(59,130,246,0.2); color: var(--running); }
  .badge-completed { background: rgba(34,197,94,0.2); color: var(--success); }
  .badge-pending { background: rgba(100,116,139,0.2); color: var(--pending); }

  /* Phases */
  .phase-bar { display: flex; gap: 2px; margin: 12px 0; }
  .phase-dot { flex: 1; height: 6px; border-radius: 3px; background: var(--border); }
  .phase-dot.completed { background: var(--success); }
  .phase-dot.running { background: var(--running); animation: pulse 1s infinite; }
  .phase-dot.failed { background: var(--failed); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* Event log */
  .event-log { max-height: 400px; overflow-y: auto; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }
  .event { padding: 6px 0; border-bottom: 1px solid rgba(30,58,95,0.2); display: flex; gap: 8px; }
  .event .time { color: var(--text-muted); white-space: nowrap; font-size: 11px; }
  .event .phase { color: var(--accent); white-space: nowrap; font-size: 11px; min-width: 100px; }
  .event .msg { flex: 1; }
  .event.type-finding .msg { color: var(--high); }
  .event.type-phase_complete .msg { color: var(--success); }
  .event.type-phase_error .msg { color: var(--critical); }

  /* Tabs */
  .tabs { display: flex; gap: 0; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
  .tab { padding: 10px 20px; cursor: pointer; color: var(--text-muted); font-size: 14px; border-bottom: 2px solid transparent; transition: all 0.15s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* Modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; align-items: center; justify-content: center; }
  .modal-overlay.active { display: flex; }
  .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
  .modal h2 { margin-bottom: 16px; }

  /* Live indicator */
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); display: inline-block; }
  .live-dot.inactive { background: var(--text-muted); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .hidden { display: none !important; }
  .mb { margin-bottom: 16px; }
  .mt { margin-top: 16px; }
  .text-muted { color: var(--text-muted); }
  .text-sm { font-size: 12px; }
  .text-center { text-align: center; }
  .flex-between { display: flex; justify-content: space-between; align-items: center; }
  .gap { gap: 8px; }
  pre { background: var(--bg); padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="icon">&#128027;</span>
    <div>BugHunter <span>AI</span></div>
  </div>
  <div class="stats" id="header-stats">
    <div class="stat">Sessions: <b id="stat-sessions">-</b></div>
    <div class="stat">Findings: <b id="stat-findings">-</b></div>
    <div class="stat">Critical: <b id="stat-critical" style="color:var(--critical)">-</b></div>
    <div class="stat"><span class="live-dot" id="live-indicator"></span> <b id="stat-active">-</b> active</div>
  </div>
</header>

<div class="layout">
  <nav>
    <div class="nav-section">Main</div>
    <a onclick="showPage('dashboard')" class="active" data-page="dashboard">
      <span class="nav-icon">&#9200;</span> Dashboard
    </a>
    <a onclick="showPage('hunt')" data-page="hunt">
      <span class="nav-icon">&#128269;</span> New Hunt
    </a>
    <a onclick="showPage('sessions')" data-page="sessions">
      <span class="nav-icon">&#128196;</span> Sessions
    </a>
    <div class="nav-section">Data</div>
    <a onclick="showPage('targets')" data-page="targets">
      <span class="nav-icon">&#127919;</span> Targets
    </a>
    <a onclick="showPage('findings')" data-page="findings">
      <span class="nav-icon">&#9888;</span> Findings
    </a>
    <a onclick="showPage('vault')" data-page="vault">
      <span class="nav-icon">&#128274;</span> Vault
    </a>
    <div class="nav-section">Intel</div>
    <a onclick="showPage('patterns')" data-page="patterns">
      <span class="nav-icon">&#128218;</span> Patterns
    </a>
    <a onclick="showPage('logs')" data-page="logs">
      <span class="nav-icon">&#128221;</span> Learning Logs
    </a>
    <div class="nav-section">System</div>
    <a onclick="showPage('settings')" data-page="settings">
      <span class="nav-icon">&#9881;</span> Settings
    </a>
  </nav>

  <main id="main-content"></main>
</div>

<!-- Report Modal -->
<div class="modal-overlay" id="report-modal">
  <div class="modal"><div id="report-modal-content"></div></div>
</div>

<!-- Live Hunt Modal -->
<div class="modal-overlay" id="live-hunt-modal">
  <div class="modal" style="max-width:900px;" id="live-hunt-content"></div>
</div>

<script>
// === APP STATE ===
let currentPage = 'dashboard';
let currentSessionId = null;
let ws = null;
let eventSource = null;
let activeHuntInterval = null;

// === NAVIGATION ===
function showPage(page, data) {
  currentPage = page;
  document.querySelectorAll('nav a[data-page]').forEach(a => a.classList.remove('active'));
  const navLink = document.querySelector(`nav a[data-page="${page}"]`);
  if (navLink) navLink.classList.add('active');
  const main = document.getElementById('main-content');
  switch(page) {
    case 'dashboard': renderDashboard(main, data); break;
    case 'hunt': renderNewHunt(main); break;
    case 'sessions': renderSessions(main); break;
    case 'targets': renderTargets(main); break;
    case 'findings': renderFindings(main); break;
    case 'vault': renderVault(main); break;
    case 'patterns': renderPatterns(main); break;
    case 'logs': renderLogs(main); break;
    case 'settings': renderSettings(main); break;
  }
}

// === API HELPERS ===
async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  const ct = res.headers.get('content-type') || '';
  if (!res.ok) {
    const text = await res.text().catch(() => '');
    throw new Error(`HTTP ${res.status}: ${text.substring(0, 200)}`);
  }
  if (!ct.includes('application/json')) {
    const text = await res.text().catch(() => '');
    throw new Error(`Non-JSON response: ${text.substring(0, 200)}`);
  }
  return res.json();
}
const get = (p) => api('GET', p);
const post = (p, b) => api('POST', p, b);
const del = (p) => api('DELETE', p);

// === HEADER STATS ===
async function updateHeaderStats() {
  try {
    const stats = await get('/api/stats');
    document.getElementById('stat-sessions').textContent = stats.total_sessions;
    document.getElementById('stat-findings').textContent = stats.total_findings;
    document.getElementById('stat-critical').textContent = stats.critical_findings;
    document.getElementById('stat-active').textContent = stats.active_hunts;
    const dot = document.getElementById('live-indicator');
    dot.className = 'live-dot' + (stats.active_hunts > 0 ? '' : ' inactive');
  } catch(e) {}
}

// === WEBSOCKET ===
function connectWebSocket() {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${protocol}//${location.host}/ws`);
  ws.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.type === 'hunt_complete' || data.type === 'hunt_error') {
      updateHeaderStats();
      if (currentPage === 'sessions') renderSessions(document.getElementById('main-content'));
      if (currentPage === 'dashboard') renderDashboard(document.getElementById('main-content'));
    }
    if (data.type === 'finding') {
      updateHeaderStats();
    }
    if (currentSessionId && data.session_id === currentSessionId) {
      if (currentPage === 'hunt') {
        updateLiveHuntView(data);
      }
    }
  };
  ws.onclose = () => { setTimeout(connectWebSocket, 3000); };
}
connectWebSocket();

// === SSE ===
function connectSSE() {
  eventSource = new EventSource('/api/events/stream');
  eventSource.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      if (data.type === 'finding') updateHeaderStats();
    } catch(ex) {}
  };
}
connectSSE();

// === PAGE RENDERERS ===

function renderDashboard(main) {
  get('/api/stats').then(stats => {
    get('/api/targets').then(targets => {
      get('/api/sessions').then(sessions => {
        const recentSessions = sessions.slice(0, 5);
        const recentFindings = sessions.flatMap(s => s.findings_count || 0).reduce((a, b) => a + b, 0);

        get('/api/findings').then(findings => {
          const critical = findings.filter(f => f.severity === 'critical');
          const high = findings.filter(f => f.severity === 'high');

          main.innerHTML = `
            <h2 style="margin-bottom:20px;">Dashboard</h2>
            <div class="grid grid-4 mb">
              <div class="stat-card critical"><div class="value">${stats.critical_findings}</div><div class="label">Critical Findings</div></div>
              <div class="stat-card high"><div class="value">${stats.high_findings}</div><div class="label">High Findings</div></div>
              <div class="stat-card total"><div class="value">${stats.total_findings}</div><div class="label">Total Findings</div></div>
              <div class="stat-card active"><div class="value">${stats.active_hunts}</div><div class="label">Active Hunts</div></div>
            </div>
            <div class="grid grid-2">
              <div class="card">
                <div class="card-header">&#127919; Recent Targets (${targets.length} total)</div>
                ${targets.length === 0 ? '<p class="text-muted text-sm">No targets yet. Start a new hunt.</p>' :
                  targets.slice(0, 5).map(t => `
                    <div class="flex-between" style="padding:8px 0;border-bottom:1px solid var(--border);">
                      <div><strong>${htmlEscape(t.name)}</strong><br><span class="text-muted text-sm">${htmlEscape(t.url)}</span></div>
                      <span class="badge badge-info">${t.target_type || 'web'}</span>
                    </div>
                  `).join('')}
                ${targets.length > 5 ? `<p class="text-muted text-sm mt">+ ${targets.length - 5} more</p>` : ''}
              </div>
              <div class="card">
                <div class="card-header">&#128196; Recent Sessions (${sessions.length} total)</div>
                ${sessions.length === 0 ? '<p class="text-muted text-sm">No sessions yet.</p>' :
                  recentSessions.map(s => `
                    <div class="flex-between" style="padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer;" onclick="showPage('sessions');viewSession(${s.id})">
                      <div>
                        <strong>${htmlEscape(s.target_name || 'Unknown')}</strong>
                        <span class="badge badge-${s.mode === 'bounty' ? 'high' : s.mode === 'pentest' ? 'medium' : 'info'}">${s.mode}</span>
                        <br><span class="text-muted text-sm">${s.started_at} &middot; ${s.findings_count} findings</span>
                      </div>
                      <span class="badge badge-${s.status === 'completed' ? 'completed' : s.status === 'running' ? 'running' : 'pending'}">${s.status}</span>
                    </div>
                  `).join('')}
              </div>
            </div>
            ${critical.length > 0 ? `
            <div class="card mt">
              <div class="card-header">&#9888; Recent Critical Findings</div>
              <table>
                <thead><tr><th>Title</th><th>Target</th><th>CVSS</th><th>Type</th><th>Date</th></tr></thead>
                <tbody>
                  ${critical.slice(0, 5).map(f => `
                    <tr>
                      <td><strong>${htmlEscape(f.title)}</strong></td>
                      <td>${htmlEscape(f.target_url || '')}</td>
                      <td><span class="badge badge-critical">${f.cvss_score}</span></td>
                      <td>${f.vulnerability_type}</td>
                      <td class="text-muted text-sm">${f.discovered_at}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>` : ''}
          `;
        });
      });
    });
  });
}

function renderNewHunt(main) {
  get('/api/targets').then(targets => {
    get('/api/sessions').then(sessions => {
      main.innerHTML = `
        <h2 style="margin-bottom:20px;">&#128269; New Bug Bounty Hunt</h2>
        <div class="grid grid-2">
          <div>
            <div class="card">
              <div class="card-header">Configure Hunt</div>
              <div class="form-group">
                <label>Target URL *</label>
                <input id="hunt-url" placeholder="https://app.example.com" value="">
              </div>
              <div class="form-group">
                <label>Target Name</label>
                <input id="hunt-name" placeholder="My Target (auto-filled from URL)">
              </div>
              <div class="form-group">
                <label>Program Name (optional)</label>
                <input id="hunt-program" placeholder="e.g., HackerOne - ExampleCorp">
              </div>
              <div class="row">
                <div class="form-group">
                  <label>Hunt Mode</label>
                  <select id="hunt-mode">
                    <option value="bounty">Bounty (CVSS &ge; 8.0, top 10 findings)</option>
                    <option value="pentest">Pentest (CVSS &ge; 4.0, top 20 findings)</option>
                    <option value="comprehensive">Comprehensive (all findings, up to 50)</option>
                  </select>
                </div>
                <div class="form-group">
                  <label>Target Type</label>
                  <select id="hunt-type">
                    <option value="web">Web Application</option>
                    <option value="api">API / Web Service</option>
                    <option value="mobile">Mobile (APK/IPA)</option>
                    <option value="network">Network / Infrastructure</option>
                  </select>
                </div>
              </div>
              <div class="form-group">
                <label>Scope Include (comma-separated, * for wildcard)</label>
                <input id="hunt-scope-in" placeholder="*.example.com, api.example.com" value="*">
              </div>
              <div class="form-group">
                <label>Scope Exclude (comma-separated)</label>
                <input id="hunt-scope-out" placeholder="blog.example.com, status.example.com">
              </div>
              <details style="margin-bottom:14px;">
                <summary style="cursor:pointer;color:var(--text-muted);font-size:13px;padding:4px 0;">
                  &#128274; Target Credentials (optional)
                </summary>
                <div style="padding:8px 0 0 0;">
                  <div class="row">
                    <div class="form-group">
                      <label>Username</label>
                      <input id="hunt-cred-user" placeholder="user@example.com">
                    </div>
                    <div class="form-group">
                      <label>Password</label>
                      <input id="hunt-cred-pass" type="password" placeholder="password">
                    </div>
                  </div>
                  <div class="form-group">
                    <label>Cookie (session token, alternative to user/pass)</label>
                    <input id="hunt-cred-cookie" placeholder="session=abc123; token=xyz">
                  </div>
                </div>
              </details>
              <button onclick="startHunt()" style="width:100%;padding:14px;">&#128269; Start Hunt</button>
              <div id="hunt-error" class="hidden mt" style="color:var(--critical);"></div>
            </div>

            <div class="card">
              <div class="card-header">&#128196; Active & Recent Sessions</div>
              <div id="existing-sessions-list">
                ${sessions.length === 0 ? '<p class="text-muted text-sm">No sessions yet</p>' :
                  sessions.slice(0, 8).map(s => `
                    <div class="flex-between" style="padding:8px 0;border-bottom:1px solid var(--border);">
                      <div>
                        <strong>${htmlEscape(s.target_name || 'Unknown')}</strong>
                        <span class="badge badge-${s.mode === 'bounty' ? 'high' : 'medium'}">${s.mode}</span>
                        <br><span class="text-muted text-sm">Phase: ${s.current_phase} &middot; ${s.findings_count} findings</span>
                      </div>
                      <div style="display:flex;gap:8px;">
                        <span class="badge badge-${s.status === 'completed' ? 'completed' : s.status === 'running' ? 'running' : 'pending'}">${s.status}</span>
                        <button class="btn-sm btn-outline" onclick="viewSession(${s.id})">View</button>
                        ${s.status !== 'completed' ? `<button class="btn-sm btn-outline" onclick="resumeHunt(${s.id})">Resume</button>` : ''}
                        <button class="btn-sm btn-danger" onclick="deleteSession(${s.id})">X</button>
                      </div>
                    </div>
                  `).join('')}
              </div>
            </div>
          </div>
          <div>
            <div class="card">
              <div class="card-header">&#127919; Saved Targets</div>
              ${targets.length === 0 ? '<p class="text-muted text-sm">No saved targets</p>' :
                targets.map(t => `
                  <div class="flex-between" style="padding:8px 0;border-bottom:1px solid var(--border);">
                    <div>
                      <strong>${htmlEscape(t.name)}</strong><br>
                      <span class="text-muted text-sm">${htmlEscape(t.url)} &middot; ${t.target_type}</span>

// === ACTIONS ===

async function startHunt() {
  const url = document.getElementById('hunt-url').value.trim();
  const name = document.getElementById('hunt-name').value.trim() || url;
  const program = document.getElementById('hunt-program').value.trim();
  const mode = document.getElementById('hunt-mode').value;
  const type = document.getElementById('hunt-type').value;
  const scopeIn = document.getElementById('hunt-scope-in').value.trim() || '*';
  const scopeOut = document.getElementById('hunt-scope-out').value.trim();
  const credUser = document.getElementById('hunt-cred-user').value.trim();
  const credPass = document.getElementById('hunt-cred-pass').value;
  const credCookie = document.getElementById('hunt-cred-cookie').value.trim();
  const errorDiv = document.getElementById('hunt-error');

  if (!url) { errorDiv.textContent = 'Target URL is required'; errorDiv.classList.remove('hidden'); return; }
  errorDiv.classList.add('hidden');

  try {
    const targetRes = await post('/api/targets', { name, url, program_name: program, scope_in: scopeIn, scope_out: scopeOut, target_type: type });

    // Save credentials if any were provided
    if (credUser || credPass || credCookie) {
      await post('/api/credentials', {
        target_name: name || url,
        username: credUser || undefined,
        password: credPass || undefined,
        cookie: credCookie || undefined
      });
    }

    const sessionRes = await post('/api/sessions', { target_id: targetRes.id, mode });
    const startRes = await post(`/api/sessions/${sessionRes.id}/start`);
    updateHeaderStats();
    viewSessionLive(sessionRes.id);
  } catch(e) {
    errorDiv.textContent = 'Error: ' + e.message;
    errorDiv.classList.remove('hidden');
  }
}

async function quickHunt(url, name, program, type) {
  const targetRes = await post('/api/targets', { name, url, program_name: program, target_type: type });
  const sessionRes = await post('/api/sessions', { target_id: targetRes.id, mode: 'bounty' });
  await post(`/api/sessions/${sessionRes.id}/start`);
  updateHeaderStats();
  viewSessionLive(sessionRes.id);
}

async function resumeHunt(sessionId) {
  await post(`/api/sessions/${sessionId}/resume`);
  updateHeaderStats();
  viewSessionLive(sessionId);
}

async function deleteSession(sessionId) {
  if (!confirm('Delete this session and all its findings?')) return;
  await del(`/api/sessions/${sessionId}`);
  updateHeaderStats();
  showPage(currentPage);
}

async function deleteTarget(targetId) {
  if (!confirm('Delete this target and all associated sessions?')) return;
  await del(`/api/targets/${targetId}`);

async function addTarget() {
  const url = document.getElementById('new-target-url').value.trim();

// === SESSION VIEW ===

async function viewSession(sessionId) {
  const modal = document.getElementById('live-hunt-modal');
  const content = document.getElementById('live-hunt-content');
  modal.classList.add('active');
  content.innerHTML = '<p>Loading session...</p>';
  loadSessionDetail(sessionId, content);
  modal.onclick = (e) => { if (e.target === modal) { modal.classList.remove('active'); currentSessionId = null; } };
}

async function viewSessionLive(sessionId) {
  currentSessionId = sessionId;
  const modal = document.getElementById('live-hunt-modal');
  const content = document.getElementById('live-hunt-content');
  modal.classList.add('active');
  content.innerHTML = '<p>Starting hunt...</p>';
  await loadSessionDetail(sessionId, content);
  // Poll for updates
  if (activeHuntInterval) clearInterval(activeHuntInterval);
  activeHuntInterval = setInterval(() => loadSessionDetail(sessionId, content, true), 2000);
  modal.onclick = (e) => { if (e.target === modal) { modal.classList.remove('active'); currentSessionId = null; if (activeHuntInterval) clearInterval(activeHuntInterval); } };
}

function updateLiveHuntView(data) {
  if (currentSessionId && data.session_id === currentSessionId) {
    const content = document.getElementById('live-hunt-content');
    loadSessionDetail(currentSessionId, content, true);
  }
}

async function loadSessionDetail(sessionId, container, silent = false) {
  try {
    const session = await get(`/api/sessions/${sessionId}`);
    const targetName = session.target_name || 'Unknown Target';
    const targetUrl = session.target_url || 'unknown';
    const phases = session.phases || [];
    const findings = session.findings || [];
    const events = session.events || [];
    const phases_ordered = ['INIT','MEMORY_LOAD','TARGET_INGEST','APP_UNDERSTANDING','RECON','AGENT_DEPLOY','DYNAMIC_TEST','VULN_ASSESS','LEARNING','REPORT'];
    let minCvss = '-';
    try { const cfg = typeof session.config === 'string' ? JSON.parse(session.config) : (session.config || {}); minCvss = cfg.min_cvss || '-'; } catch(e) {}

    container.innerHTML = `
      <div class="flex-between" style="margin-bottom:20px;">
        <h2>Hunt #${session.id}: ${htmlEscape(targetName)}</h2>
        <span class="badge badge-${session.status === 'running' ? 'running' : session.status === 'completed' ? 'completed' : 'pending'}">${session.status}</span>
      </div>

      <p><strong>Target:</strong> ${htmlEscape(targetUrl)} &middot; <strong>Mode:</strong> ${session.mode} &middot; <strong>Started:</strong> ${session.started_at}</p>
      <p><strong>Min CVSS:</strong> ${minCvss} &middot; <strong>Findings:</strong> ${findings.length}</p>

      <h4 style="margin:16px 0 8px;">Phase Progress</h4>
      <div class="phase-bar">
        ${phases_ordered.map(p => {
          const ph = phases.find(x => x.phase_name === p);
          const status = ph?.status || 'pending';
          return `<div class="phase-dot ${status}" title="${p}: ${status}"></div>`;
        }).join('')}
      </div>
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);margin-bottom:16px;">
        ${phases_ordered.map(p => `<span>${p.replace(/_/g,'<wbr>')}</span>`).join('')}
      </div>

      <div style="display:flex;gap:12px;">
        <button onclick="downloadReport(${session.id}, 'json')" class="btn-sm btn-outline">Download JSON Report</button>
        <button onclick="downloadReport(${session.id}, 'markdown')" class="btn-sm btn-outline">Download Markdown Report</button>
        ${session.status !== 'running' && session.status !== 'completed' ? `<button onclick="resumeHunt(${session.id})" class="btn-sm">Resume Hunt</button>` : ''}
        ${session.status === 'running' ? `<button onclick="abortHunt(${session.id})" class="btn-sm btn-danger">Abort</button>` : ''}
      </div>

      ${findings.length > 0 ? `
        <h4 style="margin:20px 0 8px;">Findings (${findings.length})</h4>
        <div style="max-height:300px;overflow-y:auto;">
          ${findings.map(f => `
            <div class="card" style="margin-bottom:8px;">
              <div class="flex-between">
                <strong>${htmlEscape(f.title)}</strong>
                <span class="badge badge-${f.severity}">${f.severity} (${f.cvss_score})</span>
              </div>
              <p class="text-sm text-muted">${f.vulnerability_type} &middot; ${f.endpoint || 'N/A'} &middot; ${f.agent_name}</p>
            </div>
          `).join('')}
        </div>
      ` : '<p class="text-muted text-sm mt">No findings yet...</p>'}

      <h4 style="margin:20px 0 8px;">Event Log</h4>
      <div class="event-log" id="session-event-log">
        ${events.map(e => `
          <div class="event type-${e.event_type}">
            <span class="time">${(e.created_at || '').substring(11,19) || ''}</span>
            <span class="phase">${e.phase || ''}</span>
            <span class="msg">${htmlEscape(e.message)}</span>
          </div>
        `).join('')}
      </div>
    `;

    // Scroll event log to bottom
    const log = document.getElementById('session-event-log');
    if (log) log.scrollTop = log.scrollHeight;
  } catch(e) {
    if (!silent) container.innerHTML = `<p style="color:var(--critical);">Error loading session: ${e.message}</p>`;
  }
}

async function abortHunt(sessionId) {
  await del(`/api/sessions/${sessionId}`);
  updateHeaderStats();
  document.getElementById('live-hunt-modal').classList.remove('active');
  currentSessionId = null;
  if (activeHuntInterval) clearInterval(activeHuntInterval);
  showPage('dashboard');
}

function downloadReport(sessionId, format) {
  window.open(`/api/sessions/${sessionId}/report/${format}`, '_blank');
}

// Utility
function htmlEscape(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function renderSettings(main) {
  let settings = { provider: 'claude', model: 'claude-sonnet-4-6', base_url: '', has_api_key: false };
  try { settings = await get('/api/settings'); } catch(e) {}

  main.innerHTML = `
    <h2 style="margin-bottom:20px;">&#9881; Settings</h2>

    <div class="grid grid-2">
      <div class="card">
        <div class="card-header">AI Provider</div>
        <div class="form-group">
          <label>Provider</label>
          <select id="ai-provider" onchange="updateProviderFields()">
            <option value="claude" ${settings.provider === 'claude' ? 'selected' : ''}>Claude (Anthropic)</option>
            <option value="openai" ${settings.provider === 'openai' ? 'selected' : ''}>OpenAI</option>
            <option value="ollama" ${settings.provider === 'ollama' ? 'selected' : ''}>Ollama (Local)</option>
            <option value="custom" ${settings.provider === 'custom' ? 'selected' : ''}>Custom (OpenAI-compatible)</option>
          </select>
        </div>
        <div class="form-group">
          <label>API Key</label>
          <input id="ai-apikey" type="password" placeholder="${settings.has_api_key ? '(key saved — enter new to change)' : 'sk-...'}">
        </div>
        <div class="form-group">
          <label>Model</label>
          <input id="ai-model" value="${htmlEscape(settings.model)}" placeholder="claude-sonnet-4-6">
        </div>
        <div class="form-group" id="baseurl-group" style="display:${settings.provider === 'ollama' || settings.provider === 'custom' ? '' : 'none'}">
          <label>Base URL</label>
          <input id="ai-baseurl" value="${htmlEscape(settings.base_url)}" placeholder="${settings.provider === 'ollama' ? 'http://localhost:11434' : 'https://your-api.com'}">
        </div>
        <div style="display:flex;gap:8px;">
          <button onclick="saveSettings()">Save Settings</button>
          <button class="btn-outline" onclick="testConnection()">Test Connection</button>
        </div>
        <div id="settings-result" class="mt"></div>
      </div>

      <div class="card">
        <div class="card-header">Provider Info</div>
        <div id="provider-info">
          <p class="text-muted text-sm">Select a provider to see setup instructions.</p>
        </div>
      </div>
    </div>
  `;

  updateProviderInfo();
}

function updateProviderFields() {
  const provider = document.getElementById('ai-provider')?.value;
  const urlGroup = document.getElementById('baseurl-group');
  const urlInput = document.getElementById('ai-baseurl');
  if (urlGroup) urlGroup.style.display = (provider === 'ollama' || provider === 'custom') ? '' : 'none';
  if (urlInput && provider === 'ollama' && !urlInput.value) urlInput.placeholder = 'http://localhost:11434';
  if (urlInput && provider === 'custom' && !urlInput.value) urlInput.placeholder = 'https://your-api.com';
  updateProviderInfo();
}

function updateProviderInfo() {
  const provider = document.getElementById('ai-provider')?.value;
  const info = document.getElementById('provider-info');
  if (!info) return;

  const guides = {
    claude: `<p>Uses <strong>Claude Code CLI</strong> if available locally, or the <strong>Anthropic API</strong> directly with your key.</p>
      <p class="text-muted text-sm">Model: <code>claude-sonnet-4-6</code>, <code>claude-opus-4-6</code>, etc.</p>
      <p class="text-muted text-sm">Get a key at <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a></p>
      <p class="text-muted text-sm">Leave API key blank to use local Claude Code binary if installed.</p>`,
    openai: `<p>Uses the <strong>OpenAI API</strong> with your API key.</p>
      <p class="text-muted text-sm">Model: <code>gpt-4o</code>, <code>gpt-4-turbo</code>, etc.</p>
      <p class="text-muted text-sm">Get a key at <a href="https://platform.openai.com/api-keys" target="_blank">platform.openai.com</a></p>`,
    ollama: `<p>Uses a <strong>local Ollama</strong> instance. No API key needed.</p>
      <p class="text-muted text-sm">Install: <code>curl -fsSL https://ollama.com/install.sh | sh</code></p>
      <p class="text-muted text-sm">Pull a model: <code>ollama pull llama3</code></p>
      <p class="text-muted text-sm">Default URL: <code>http://localhost:11434</code></p>`,
    custom: `<p>Uses any <strong>OpenAI-compatible API</strong> (LM Studio, vLLM, Groq, Together, etc.)</p>
      <p class="text-muted text-sm">Must implement <code>/v1/chat/completions</code> endpoint.</p>
      <p class="text-muted text-sm">Set the base URL and model name to match your provider.</p>`
  };
  info.innerHTML = guides[provider] || guides.claude;
}

async function saveSettings() {
  const resultDiv = document.getElementById('settings-result');
  const provider = document.getElementById('ai-provider').value;
  const model = document.getElementById('ai-model').value.trim();
  const base_url = document.getElementById('ai-baseurl').value.trim();
  const api_key = document.getElementById('ai-apikey').value;

  try {
    const res = await post('/api/settings', {
      provider,
      model: model || undefined,
      base_url: base_url || '',
      api_key: api_key || undefined
    });
    resultDiv.innerHTML = `<span style="color:var(--success);">Settings saved. Provider: ${res.provider}, Connected: ${res.connected ? 'yes' : 'no'}</span>`;
    // Clear the key field after saving
    document.getElementById('ai-apikey').value = '';
    document.getElementById('ai-apikey').placeholder = '(key saved)';
    updateHeaderStats();
  } catch(e) {
    resultDiv.innerHTML = `<span style="color:var(--critical);">Error: ${e.message}</span>`;
  }
}

async function testConnection() {
  const resultDiv = document.getElementById('settings-result');
  resultDiv.innerHTML = '<span style="color:var(--accent);">Testing connection...</span>';
  try {
    const res = await post('/api/settings/test');
    if (res.success) {
      resultDiv.innerHTML = `<span style="color:var(--success);">Connection OK — Response: "${res.response}"</span>`;
    } else {
      resultDiv.innerHTML = `<span style="color:var(--critical);">Connection failed: ${res.error}</span>`;
    }
  } catch(e) {
    resultDiv.innerHTML = `<span style="color:var(--critical);">Error: ${e.message}</span>`;
  }
}

// === INIT ===
updateHeaderStats();
showPage('dashboard');
setInterval(updateHeaderStats, 10000);
</script>
</body>
</html>
