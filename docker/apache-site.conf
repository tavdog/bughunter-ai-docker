<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/bughunter.clodhost.com/public

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/bughunter.crt
    SSLCertificateKeyFile /etc/ssl/private/bughunter.key

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    <Directory /var/www/bughunter.clodhost.com/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Auth (optional — set BUGHUNTER_USER/BUGHUNTER_PASS env vars to enable)
    <IfDefine AUTH_ENABLED>
        <Location />
            AuthType Basic
            AuthName "BugHunter AI"
            AuthUserFile /etc/apache2/.htpasswd
            Require valid-user
        </Location>
    </IfDefine>

    # Proxy API + WebSocket to Node.js
    ProxyPreserveHost On
    ProxyTimeout 300

    ProxyPass /api http://127.0.0.1:3000/api retry=0 connectiontimeout=5 timeout=300
    ProxyPassReverse /api http://127.0.0.1:3000/api

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/ws(.*) "ws://127.0.0.1:3000/ws$1" [P,L]

    ProxyPass /ws http://127.0.0.1:3000/ws retry=0 connectiontimeout=5 timeout=300
    ProxyPassReverse /ws http://127.0.0.1:3000/ws

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>

<VirtualHost *:80>
    ServerName localhost
    Redirect permanent / https://localhost/
</VirtualHost>
