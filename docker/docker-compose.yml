services:
  bughunter:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "443:443"
    environment:
      # Optional: protect the web UI with basic auth (set both to enable)
      - BUGHUNTER_USER=${BUGHUNTER_USER:-}
      - BUGHUNTER_PASS=${BUGHUNTER_PASS:-}

      # Optional: override the vault encryption key (auto-generated if blank)
      - VAULT_ENCRYPTION_KEY=${VAULT_ENCRYPTION_KEY:-}

      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/data/bughunter.db
    volumes:
      - bughunter_data:/data
      - bughunter_reports:/var/www/bughunter.clodhost.com/public/reports
    restart: unless-stopped

volumes:
  bughunter_data:
  bughunter_reports:
